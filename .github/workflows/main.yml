# .github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:

permissions:
  id-token: write
  contents: write 

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: cargo test

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOMit SBOM
        uses: Marc-cn/sbomit-pipeline@main
        with:
          command: cargo build --release
          checkout: false
          artifact_name: sbomit-${{ github.sha }}

      - name: Upload artifact + SBOM
        uses: actions/upload-artifact@v4
        with:
          name: trunk-${{ github.ref_name }}
          path: |
            target/release/trunk
            attestation.json
            sbom/sbom.spdx.json
            sbom/sbom.cdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          files: |
            target/release/trunk
            attestation.json
            sbom/sbom.spdx.json
